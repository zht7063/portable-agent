<div class="credential">
  <div class="secret">
    <div class="secret-label">
      <span>服务器地址</span>
      <button class="copy" type="button" data-copy="{{ relay_base_url }}">复制</button>
    </div>
    <code>{{ relay_base_url }}</code>
  </div>
  <div class="secret">
    <div class="secret-label">
      <span>API key</span>
      <button class="copy" type="button" data-copy="{{ order.api_key }}">复制</button>
    </div>
    <code>{{ order.api_key }}</code>
  </div>
  <p class="hint">在 Codex 的自定义服务里填写上面的地址和这把 API key。</p>
</div>
